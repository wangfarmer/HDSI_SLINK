[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hdsi-slink"
version = "0.1.0"
description = "Research utilities for HUMA.I.N S-Link data collection and grouping experiments."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "curl_cffi",
  "requests",
]

[tool.setuptools.packages.find]
include = ["harvard_faculty_scraper*", "slink*"]
